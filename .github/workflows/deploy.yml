# Build e publicação automática.
#
#   push na main → build de produção  → branch "deploy"      (arenapinhais.com.br)
#   push na dev  → build de homologação → branch "deploy-dev" (dev.arenapinhais.com.br)
#
# As branches de publicação têm só o conteúdo de dist/ (inclusive .htaccess e api/),
# num único commit sem histórico do código. A Hostinger puxa dessas branches.

name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Ambiente
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "DESTINO=deploy" >> "$GITHUB_ENV"
          else
            echo "DESTINO=deploy-dev" >> "$GITHUB_ENV"
            # Homologação: URL própria e nada indexável (ver plugins/seo.ts)
            echo "VITE_SITE_URL=https://dev.arenapinhais.com.br" >> "$GITHUB_ENV"
            echo "VITE_HOMOLOGACAO=true" >> "$GITHUB_ENV"
          fi

      - run: npm ci

      - run: npm run build

      - name: Conferir dist/
        run: |
          for f in index.html .htaccess api/interesse.php robots.txt og-image.png brand/arena-pinhais-escuro-transparente.svg; do
            test -f "dist/$f" || { echo "::error::Faltou dist/$f"; exit 1; }
          done
          if [ "$DESTINO" = "deploy-dev" ]; then
            grep -q 'name="robots" content="noindex' dist/index.html || { echo "::error::Homologação sem meta noindex"; exit 1; }
            grep -q '^Disallow: /$' dist/robots.txt || { echo "::error::Homologação sem Disallow: /"; exit 1; }
            grep -q 'X-Robots-Tag' dist/.htaccess || { echo "::error::Homologação sem X-Robots-Tag"; exit 1; }
          else
            ! grep -q 'noindex' dist/index.html dist/robots.txt dist/.htaccess || { echo "::error::Produção com noindex"; exit 1; }
          fi
          echo "Arquivos publicados:" && (cd dist && find . -type f | sort)

      - name: Publicar em ${{ env.DESTINO }}
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b "$DESTINO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy de ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$DESTINO"
